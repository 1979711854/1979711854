name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate summary cards (includes private repos via PAT)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # 必须是一个具备私有仓库读取权限的 PAT（见下方说明）；缺失时本步骤会失败
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: 1979711854
          BRANCH_NAME: profile-cards   # 卡片提交到此独立分支，避免推回 main 触发死循环
          NAME: Henceforth             # 覆盖 profile-details 标题，显示为 Henceforth
          THEME: tokyonight
          UTC_OFFSET: 8
