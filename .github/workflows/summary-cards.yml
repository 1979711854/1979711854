name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate summary cards (AUTO_PUSH disabled; we publish manually)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # 优先用具备私有仓库读取权限的 PAT；未配置时退回自动注入的 GITHUB_TOKEN（仅公开数据）
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: 1979711854
          NAME: Henceforth
          THEME: tokyonight
          UTC_OFFSET: 8
          AUTO_PUSH: false

      - name: Publish cards to profile-cards branch
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC="profile-summary-card-output/tokyonight"
          DST="profile-summary-card-output"
          # 暂存生成的卡片，避免后续切换分支时丢失
          cp -r "$SRC" /tmp/cards
          # 用一个独立的 orphan 分支承载卡片，避免污染 main 历史
          git branch -D profile-cards 2>/dev/null || true
          git checkout --orphan profile-cards
          git rm -rf --ignore-unmatched . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          mkdir -p "$DST"
          cp /tmp/cards/0-profile-details.svg    "$DST/profile-details.svg"
          cp /tmp/cards/1-repos-per-language.svg "$DST/repos-per-language.svg"
          cp /tmp/cards/3-stats.svg              "$DST/stats.svg"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes; skip commit."
          else
            git commit -m "Update summary cards (auto)"
            git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/1979711854/1979711854.git" profile-cards
          fi
