name: Generate snake animation

on:
  schedule:
    # 北京时间 00:47（UTC 16:47）。紧接 UTC 日期翻转之后触发，
    # 所以早上看到的蛇是"昨天已经走完"的完整数据。
    # 刻意避开整点：GitHub 的 cron 在整点最拥堵，实测会延迟 3~6 小时，
    # 之前的 0 0 * * *（北京时间 08:00）实际经常 11 点后才跑。
    - cron: "47 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate github-contribution-grid-snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: 1979711854
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
